name: Prepare Quartz WebKit
description: Build or restore the exact universal WebKit fork and verify its products.
inputs:
  jobs:
    description: Number of concurrent WebKit build jobs.
    default: '4'
runs:
  using: composite
  steps:
    - name: Check the WebKit toolchain
      shell: bash
      run: |
        if ! xcrun --sdk macosx metal --version >/dev/null 2>&1; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        Scripts/build-webkit.sh --check

    - name: Identify the compiler, SDK, and host
      id: toolchain
      shell: bash
      run: |
        python3 Scripts/webkit-toolchain.py
        printf '%s\n' "QUARTZ_WEBKIT_PRODUCTS_DIR=$GITHUB_WORKSPACE/.build/quartz-webkit/products/Release" >> "$GITHUB_ENV"

    - name: Restore exact prepared WebKit products
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: .build/quartz-webkit/products/Release
        key: quartz-webkit-universal-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('WebKit.lock.json', 'Scripts/build-webkit.sh', 'Scripts/webkit-bundle.py', 'Scripts/webkit-toolchain.py', 'WebKit.cache-migration.json', '.github/actions/prepare-webkit/action.yml') }}

    - name: Restore the compatible pre-normalization cache
      id: legacy-cache
      if: steps.cache.outputs.cache-hit != 'true' && steps.toolchain.outputs.legacy-key != ''
      uses: actions/cache/restore@v4
      with:
        path: .build/quartz-webkit/products/Release
        key: ${{ steps.toolchain.outputs.legacy-key }}

    - name: Build the pinned WebKit fork
      if: steps.cache.outputs.cache-hit != 'true' && steps.legacy-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WEBKIT_ARCHS: arm64 x86_64
        WEBKIT_JOBS: ${{ inputs.jobs }}
        WEBKIT_PRODUCTS_DIR: ${{ github.workspace }}/.build/quartz-webkit/products/Release
      run: Scripts/build-webkit.sh

    - name: Verify provenance, dependencies, and both architectures
      shell: bash
      run: |
        python3 Scripts/webkit-bundle.py verify "$QUARTZ_WEBKIT_PRODUCTS_DIR" --arch arm64 --arch x86_64

    - name: Cache verified prepared products
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .build/quartz-webkit/products/Release
        key: ${{ steps.cache.outputs.cache-primary-key }}
