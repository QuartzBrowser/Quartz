name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      engine_revision:
        description: "Optional full WebKit candidate commit SHA to test without committing the pin or publishing."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Verify engine selection and publication boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow test dependencies
        run: python3 -m pip install -r Scripts/requirements-workflow-tests.txt
      - name: Test engine selection and workflow policy
        run: |
          python3 Scripts/test-engine-updates.py
          python3 Scripts/test-workflow-policy.py

  build:
    needs: workflow-policy
    name: Test and package Quartz WebKit (Xcode 26.6)
    runs-on: ${{ vars.QUARTZ_WEBKIT_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage the exact engine candidate for this validation run
        id: stage-engine-candidate
        if: github.event_name == 'workflow_dispatch' && inputs.engine_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUARTZ_ENGINE_REVISION: ${{ inputs.engine_revision }}
        run: |
          mkdir -p .build
          python3 Scripts/update-webkit.py candidate --revision "$QUARTZ_ENGINE_REVISION" > .build/engine-candidate.json
          cat .build/engine-candidate.json

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Test engine bundle validation
        run: |
          python3 Scripts/test-engine-updates.py
          python3 Scripts/test-webkit-toolchain.py
          python3 Scripts/test-webkit-bundle.py
          python3 Scripts/test-webkit-launcher.py

      - name: Prepare the pinned WebKit fork
        uses: ./.github/actions/prepare-webkit
        with:
          jobs: ${{ vars.QUARTZ_WEBKIT_JOBS || '4' }}

      - name: Run tests
        run: |
          Scripts/test-published-feed.sh
          Scripts/quartz.sh test

      - name: Package universal macOS app
        run: Scripts/package-macos-app.sh
        env:
          ZIP_APP: "1"

      - name: Verify universal package
        run: |
          xcrun lipo dist/Quartz.app/Contents/MacOS/Quartz -verify_arch arm64 x86_64
          unzip -t dist/Quartz.zip
          QUARTZ_UNPACKED="$(mktemp -d)"
          trap 'rm -rf "$QUARTZ_UNPACKED"' EXIT
          ditto -x -k dist/Quartz.zip "$QUARTZ_UNPACKED"
          codesign --verify --deep --strict "$QUARTZ_UNPACKED/Quartz.app"
          "$QUARTZ_UNPACKED/Quartz.app/Contents/MacOS/Quartz" --quartz-webkit-info
          python3 Scripts/test-webkit-runtime.py "$QUARTZ_UNPACKED/Quartz.app/Contents/MacOS/Quartz"

      - name: Verify update signing and tamper rejection with disposable keys
        run: Scripts/test-update-packaging.sh

      - name: Save the validated development candidate
        if: github.event_name == 'workflow_dispatch' && inputs.engine_revision != ''
        uses: actions/upload-artifact@v4
        with:
          name: quartz-webkit-candidate-${{ github.run_id }}
          path: |
            dist/Quartz.zip
            .build/engine-candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
