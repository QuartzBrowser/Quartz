name: release

on:
  workflow_dispatch:
    inputs:
      engine_revision:
        description: "Optional exact WebKit SHA: promoted main for stable, quartz-dev for beta. Empty keeps the committed pin."
        required: false
        default: ""
        type: string
      verify_version:
        description: "Read-only recheck of an existing release and update feed (for example, 1.0.1 or 1.1.0-beta.1)."
        required: false
        default: ""
        type: string
      activate_version:
        description: "Explicitly activate an existing release's signed update feed after failed feed publication. No new release."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}

concurrency:
  group: quartz-release
  cancel-in-progress: false
  # Keep deliberate requests serialized; never cancel a publication in progress.
  queue: max

jobs:
  validate-request:
    name: Validate the manual release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.validate-inputs.outputs.channel }}
      branch: ${{ steps.validate-inputs.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a release branch and unambiguous inputs
        id: validate-inputs
        shell: bash
        env:
          QUARTZ_ENGINE_REVISION: ${{ inputs.engine_revision }}
          QUARTZ_VERIFY_VERSION: ${{ inputs.verify_version }}
          QUARTZ_ACTIVATE_VERSION: ${{ inputs.activate_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "error: run this workflow manually" >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/main) QUARTZ_RELEASE_BRANCH=main; QUARTZ_RELEASE_CHANNEL=stable ;;
            refs/heads/beta) QUARTZ_RELEASE_BRANCH=beta; QUARTZ_RELEASE_CHANNEL=beta ;;
            *) echo "error: select Quartz main for stable or beta for prerelease" >&2; exit 1 ;;
          esac
          QUARTZ_INPUT_COUNT=0
          for QUARTZ_INPUT in "$QUARTZ_ENGINE_REVISION" "$QUARTZ_VERIFY_VERSION" "$QUARTZ_ACTIVATE_VERSION"; do
            if [[ -n "$QUARTZ_INPUT" ]]; then QUARTZ_INPUT_COUNT=$((QUARTZ_INPUT_COUNT + 1)); fi
          done
          if [[ "$QUARTZ_INPUT_COUNT" -gt 1 ]]; then
            echo "error: choose engine selection, read-only verification, or explicit feed activation" >&2
            exit 1
          fi
          if [[ -n "$QUARTZ_ENGINE_REVISION" && ! "$QUARTZ_ENGINE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: engine_revision must be a complete lowercase 40-character commit SHA" >&2
            exit 1
          fi
          for QUARTZ_VERSION in "$QUARTZ_VERIFY_VERSION" "$QUARTZ_ACTIVATE_VERSION"; do
            if [[ -n "$QUARTZ_VERSION" ]]; then
              QUARTZ_VERSION_CHANNEL="$(python3 Scripts/release-version.py "$QUARTZ_VERSION" --field channel)"
              if [[ "$QUARTZ_VERSION_CHANNEL" != "$QUARTZ_RELEASE_CHANNEL" ]]; then
                echo "error: requested version does not match the selected release branch" >&2
                exit 1
              fi
            fi
          done
          printf 'channel=%s\nbranch=%s\n' "$QUARTZ_RELEASE_CHANNEL" "$QUARTZ_RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

  engine-update:
    name: Plan the selected engine release
    needs: validate-request
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && inputs.verify_version == '' && inputs.activate_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      release_required: ${{ steps.plan.outputs.release_required }}
      channel: ${{ needs.validate-request.outputs.channel }}
      branch: ${{ needs.validate-request.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test engine update planning and commits
        run: |
          python3 Scripts/test-engine-updates.py
          python3 Scripts/test-webkit-toolchain.py

      - name: Plan an engine update
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          QUARTZ_ENGINE_REVISION: ${{ inputs.engine_revision }}
          QUARTZ_RELEASE_CHANNEL: ${{ needs.validate-request.outputs.channel }}
        run: |
          QUARTZ_PLAN_ARGS=()
          if [[ -n "$QUARTZ_ENGINE_REVISION" ]]; then
            QUARTZ_PLAN_ARGS+=(--revision "$QUARTZ_ENGINE_REVISION")
          fi
          python3 Scripts/update-webkit.py plan --channel "$QUARTZ_RELEASE_CHANNEL" "${QUARTZ_PLAN_ARGS[@]}"

  release:
    needs: engine-update
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && inputs.verify_version == '' && inputs.activate_version == ''
    name: Release with Quartz WebKit
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ${{ vars.QUARTZ_WEBKIT_RUNNER || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare the dispatch snapshot on a local release branch
        id: prepare-release-branch
        env:
          QUARTZ_RELEASE_BASE: ${{ github.sha }}
          QUARTZ_RELEASE_BRANCH: ${{ needs.engine-update.outputs.branch }}
        run: git switch --force-create "$QUARTZ_RELEASE_BRANCH" "$QUARTZ_RELEASE_BASE"

      - name: Stage the engine candidate for validation
        env:
          QUARTZ_ENGINE_PLAN: ${{ needs.engine-update.outputs.plan }}
        run: |
          mkdir -p .build
          printf '%s\n' "$QUARTZ_ENGINE_PLAN" > .build/engine-update-plan.json
          python3 Scripts/update-webkit.py stage --plan .build/engine-update-plan.json

      - name: Test engine bundle validation
        run: |
          python3 Scripts/test-webkit-bundle.py
          python3 Scripts/test-webkit-launcher.py

      - name: Prepare the pinned WebKit fork
        uses: ./.github/actions/prepare-webkit
        with:
          jobs: ${{ vars.QUARTZ_WEBKIT_JOBS || '4' }}

      - name: Run tests before preparing a release
        run: |
          Scripts/test-published-feed.sh
          Scripts/quartz.sh test
          Scripts/test-update-packaging.sh

      - name: Commit the validated engine update
        run: python3 Scripts/update-webkit.py commit --plan .build/engine-update-plan.json

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@7.1.0
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}

      - name: Require publication of a pending engine update
        if: needs.engine-update.outputs.release_required == 'true' && steps.release.outputs.new_release_published != 'true'
        run: |
          echo "error: the validated engine has not been published; inspect the failure and manually rerun release" >&2
          exit 1

      - name: Verify immutable public release downloads
        if: steps.release.outputs.new_release_published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
        run: Scripts/verify-published-update.sh "${RELEASE_VERSION}"

      - name: Publish the verified signed update feed
        if: steps.release.outputs.new_release_published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/publish-update-feed.py "$RELEASE_VERSION" --feed dist/release/appcast.xml --public-key "$SPARKLE_PUBLIC_KEY"

      - name: Verify the active public update feed
        if: steps.release.outputs.new_release_published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
        run: Scripts/verify-published-update.sh "$RELEASE_VERSION" --feed

  verify-published-release:
    name: Verify existing public release
    needs: validate-request
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && inputs.verify_version != '' && inputs.activate_version == ''
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test latest-feed propagation handling
        run: Scripts/test-published-feed.sh

      - name: Verify existing public release downloads
        env:
          RELEASE_VERSION: ${{ inputs.verify_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFY_DIST="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIST}"' EXIT
          mkdir -p "${VERIFY_DIST}/release"
          gh release download "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --dir "${VERIFY_DIST}/release" \
            --pattern "Quartz-v${RELEASE_VERSION}-macos-universal.zip" \
            --pattern appcast.xml --pattern SHA256SUMS
          DIST_DIR="${VERIFY_DIST}" Scripts/verify-published-update.sh "${RELEASE_VERSION}" --feed

  activate-published-feed:
    name: Activate an existing release's signed feed
    needs: validate-request
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && inputs.activate_version != '' && inputs.verify_version == ''
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.activate_version }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the existing immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" \
            --dir dist/release --pattern "Quartz-v${RELEASE_VERSION}-macos-universal.zip" \
            --pattern appcast.xml --pattern SHA256SUMS

      - name: Verify immutable public release downloads before activation
        run: Scripts/verify-published-update.sh "$RELEASE_VERSION"

      - name: Activate the verified signed feed without replacing newer history
        run: python3 Scripts/publish-update-feed.py "$RELEASE_VERSION" --feed dist/release/appcast.xml --public-key "$SPARKLE_PUBLIC_KEY"

      - name: Verify the active public update feed
        run: Scripts/verify-published-update.sh "$RELEASE_VERSION" --feed
